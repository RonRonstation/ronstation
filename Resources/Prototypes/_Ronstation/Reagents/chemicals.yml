- type: reagent
  id: Caffeine
  name: reagent-name-caffeine
  desc: reagent-desc-caffeine
  physicalDesc: reagent-physical-desc-powdery
  flavor: bitter
  color: "#E6DCE6"
  plantMetabolism:
  - !type:PlantAdjustNutrition
    amount: -0.5
  - !type:PlantAdjustHealth
    amount: -0.5
  metabolisms:
    Narcotic:
      metabolismRate: 0.2
      effects:
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.10
        sprintSpeedModifier: 1.10
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 2
        type: Remove
        probability: 0.5
      - !type:ModifyKnockdown
        time: 2
        type: Remove
        probability: 0.5
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 2
        type: Remove
        probability: 0.5
    Poison:
      metabolismRate: 0.5
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Caffeine
          min: 15
        damage:
          types:
            Poison: 0.5
      - !type:HealthChange
        probability: 0.2
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Animal ]
        damage:
          types:
            Poison: 0.5

- type: reagent
  id: Saltpetre
  name: reagent-name-saltpetre
  desc: reagent-desc-saltpetre
  physicalDesc: reagent-physical-desc-coarse
  flavor: salty
  color: "#F0F0C0"
  plantMetabolism:
    - !type:PlantAdjustNutrition
      amount: 0.1
    - !type:PlantAdjustWeeds
      amount: 0.2
    - !type:PlantAdjustToxins
      amount: 1
    - !type:PlantAdjustPotency
      conditions:
      - !type:ReagentCondition
        reagent: Saltpetre
        min: 20
  metabolisms:
    Poison:
      effects:
        - !type:HealthChange
          damage:
            types:
              Poison: 0.5
